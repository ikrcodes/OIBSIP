<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="A simple calculator for everyday arithmetic."><title>Orbit — Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--ink:#1e2b27;--muted:#829087;--paper:#f3f2ea;--lime:#d9ef70;--line:#dfe2d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 14%,#e4ebc9 0,transparent 28%),var(--paper);color:var(--ink);font:14px 'DM Sans',Arial,sans-serif}.shell{width:min(100% - 30px,390px)}.brand{display:flex;justify-content:space-between;align-items:center;margin:0 3px 15px}.brand a{font-size:15px;font-weight:700;letter-spacing:-.5px;text-decoration:none;color:var(--ink)}.brand a span{color:#8fa631}.brand small{font:8px 'DM Mono',monospace;letter-spacing:1px;color:var(--muted)}.calculator{background:#fffef9;padding:20px;border:1px solid #e3e4da;box-shadow:0 24px 60px #32413712;border-radius:8px}.screen{min-height:122px;padding:15px 14px;background:#26352f;color:#fff;border-radius:5px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden}.screen-label{font:8px 'DM Mono',monospace;letter-spacing:1.4px;color:#b8c4b4;text-align:left}.expression{font:13px 'DM Mono',monospace;color:#c6d2c0;min-height:21px;overflow-wrap:anywhere;margin-top:13px}.output{font:36px 'DM Mono',monospace;letter-spacing:-2px;min-height:45px;overflow-wrap:anywhere}.status{min-height:16px;color:#ffb4a8;font-size:9px;margin:8px 0 7px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{height:58px;border:1px solid var(--line);border-radius:5px;background:#f7f7f1;color:var(--ink);font:600 17px 'DM Sans',sans-serif;cursor:pointer;transition:transform .12s,background .12s}.keys button:hover{background:#eaf0d0}.keys button:active{transform:scale(.96)}.keys .utility{font-size:12px;background:#eeefe6}.keys .operator{background:#eef3d8;color:#55682a;font-size:20px}.keys .equals{background:var(--lime);font-size:20px;border-color:var(--lime)}.keys .zero{grid-column:span 2}.hint{text-align:center;color:#99a298;font:8px 'DM Mono',monospace;margin:14px 0 0}
</style><script src="calculator.js" defer></script></head><body><main class="shell"><div class="brand"><a href="#">orbit<span>.</span>calc</a><small>EVERYDAY ARITHMETIC</small></div><section class="calculator" aria-label="Calculator"><div class="screen" aria-live="polite"><span class="screen-label">YOUR CALCULATION</span><span id="expression" class="expression">&nbsp;</span><output id="display" class="output">0</output></div><p id="status" class="status" role="alert" aria-live="polite"></p><div class="keys" aria-label="Calculator keys">
<button class="utility" data-action="clear" aria-label="Clear all">AC</button><button class="utility" data-action="delete" aria-label="Delete last character">DEL</button><button class="operator" data-value="/" aria-label="Divide">÷</button><button class="operator" data-value="*" aria-label="Multiply">×</button>
<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="-" aria-label="Subtract">−</button>
<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="+" aria-label="Add">+</button>
<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="equals" data-action="equals" aria-label="Equals">=</button>
<button class="zero" data-value="0">0</button><button data-value=".">.</button></div></section><p class="hint">KEYBOARD READY · ENTER TO SOLVE · ESC TO CLEAR</p></main></body></html>
