<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="A simple, thoughtful to-do list for the day."><title>Daymark — Daily To-Do</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');
:root{--ink:#24312b;--muted:#77837a;--paper:#f4f3eb;--lime:#d9ef70;--line:#e1e2d8;--green:#e8eddf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:14px 'DM Sans',Arial,sans-serif}.top{height:68px;padding:0 8%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-weight:700;font-size:18px;letter-spacing:-.7px;text-decoration:none;color:var(--ink)}.logo span{color:#93a833}.top small,.eyebrow,.count,.time{font:8px 'DM Mono',monospace;letter-spacing:1px}.top small{color:var(--muted)}main{max-width:880px;margin:auto;padding:48px 7% 70px}.intro{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:26px}.eyebrow{color:#899448}.intro h1{font-size:clamp(34px,5vw,50px);letter-spacing:-2px;line-height:1.1;margin:10px 0}.intro h1 em{font:italic 500 1em 'Playfair Display',Georgia,serif}.intro p{font-size:11px;color:var(--muted);max-width:310px;line-height:1.7;margin:0 0 4px}.composer{display:flex;gap:9px;margin:20px 0 29px}.composer input{flex:1;min-width:0;height:48px;padding:0 15px;border:1px solid #d8ddd1;background:#fffef9;border-radius:4px;font:12px 'DM Sans',sans-serif;outline:none}.composer input:focus{border-color:#91a73c;box-shadow:0 0 0 3px #d9ef7045}.composer button{border:0;border-radius:4px;background:var(--ink);color:#fff;font:600 11px 'DM Sans',sans-serif;padding:0 18px;cursor:pointer}.composer button span{color:var(--lime);padding-left:10px}.lists{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list-card{background:#fffef9;border:1px solid var(--line);padding:17px 17px 13px;min-height:230px}.list-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}.list-head h2{font-size:13px;margin:0}.count{color:#89934b;letter-spacing:.4px}.items{list-style:none;padding:0;margin:0}.empty{padding:28px 7px;text-align:center;color:#9aa197;font-size:10px;line-height:1.7}.item{display:grid;grid-template-columns:17px 1fr auto;gap:9px;align-items:start;padding:13px 0;border-bottom:1px solid #edf0e9}.item:last-child{border-bottom:0}.toggle{width:16px;height:16px;border:1px solid #bdc8b0;border-radius:50%;background:transparent;color:#536727;font-size:10px;padding:0;cursor:pointer}.item.done .toggle{background:var(--lime);border-color:var(--lime)}.task-copy{font-size:11px;line-height:1.5;overflow-wrap:anywhere}.item.done .task-copy{text-decoration:line-through;color:#9da59a}.time{display:block;color:#9aa296;font-size:7px;letter-spacing:.2px;margin-top:5px}.item-actions{display:flex;gap:5px}.item-actions button{background:transparent;border:0;color:#7e897f;font:9px 'DM Sans',sans-serif;padding:4px;cursor:pointer}.item-actions button:hover{color:#25332b;text-decoration:underline}.edit-input{width:100%;border:1px solid #bbc890;background:#fff;padding:7px;font:11px 'DM Sans',sans-serif}.foot{text-align:center;margin-top:22px;color:#9ba398;font:8px 'DM Mono',monospace;letter-spacing:.7px}
@media(max-width:640px){.top{height:60px;padding:0 6%}.top small{display:none}main{padding:38px 6% 50px}.intro{display:block}.intro p{margin-top:12px}.lists{grid-template-columns:1fr}.list-card{min-height:180px}.empty{padding:20px}.item{padding:12px 0}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style><script src="todo.js" defer></script></head><body><header class="top"><a class="logo" href="#">daymark<span>.</span></a><small>MAKE SPACE FOR WHAT MATTERS</small></header><main><section class="intro"><div><p class="eyebrow">✳ &nbsp; YOUR DAY, IN VIEW</p><h1>A little progress<br><em>goes a long way.</em></h1></div><p>Keep the next step close. Add a task, make it happen, and give yourself credit for the progress.</p></section>
<form id="task-form" class="composer"><label class="sr-only" for="new-task">New task</label><input id="new-task" maxlength="180" placeholder="What would you like to get done?" autocomplete="off" required><button type="submit">Add task <span>↗</span></button></form>
<section class="lists" aria-label="Task lists"><article class="list-card"><header class="list-head"><h2>To do next</h2><span class="count" id="pending-count">0 pending</span></header><ul class="items" id="pending-list"></ul></article><article class="list-card"><header class="list-head"><h2>Done for now</h2><span class="count" id="completed-count">0 completed</span></header><ul class="items" id="completed-list"></ul></article></section><p class="foot">YOUR TASKS ARE SAVED IN THIS BROWSER</p></main></body></html>
